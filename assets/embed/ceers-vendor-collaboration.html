<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor collaboration · system diagram — animated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#FF2129; --blue:#2E47FF; --lav:#919EFF;
    --ink:#1f1f1f; --ink2:#2f2f2f; --muted:#5e5e5e; --faint:#a0a0a0;
    --line:#e4e5e9;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

  /* Section wrapper carries the page background gradients from the Figma parent frame */
  .section{
    position:relative;width:100%;height:100%;padding:0;display:flex;align-items:center;
    background:
      radial-gradient(648px 704px at calc(50% - 720px) 50%, rgba(255,33,41,.14), rgba(255,33,41,.049) 55%, rgba(255,33,41,0) 100%),
      radial-gradient(648px 704px at calc(50% + 720px) 50%, rgba(46,71,255,.16), rgba(46,71,255,.056) 55%, rgba(46,71,255,0) 100%),
      radial-gradient(360px 384px at 50% 55%, rgba(145,158,255,.14), rgba(145,158,255,.049) 55%, rgba(145,158,255,0) 100%),
      #fff;
    overflow:hidden;
  }
  .fit{position:relative;margin:0 auto;width:1200px;height:680px;transform-origin:top left}
  .stage{position:absolute;inset:0;width:1200px;height:680px}

  /* ---------- SVG field ---------- */
  svg.field{position:absolute;inset:0;overflow:visible}
  .dot{fill:#A0A0A0;opacity:0}
  .play .dot{animation:dotIn .9s var(--ease-out) forwards;animation-delay:var(--d)}
  @keyframes dotIn{from{opacity:0;transform:scale(.2)}to{opacity:var(--o);transform:scale(1)}}
  .dot{transform-box:fill-box;transform-origin:center}

  .ring-outer{stroke:#DCDCDC;fill:none;stroke-dasharray:1257;stroke-dashoffset:1257}
  .play .ring-outer{animation:draw 1.6s var(--ease-out) .25s forwards}
  .ring-dash{stroke:#BCBEC7;fill:none;stroke-dasharray:.8 5.9;stroke-linecap:round;opacity:0;transform-origin:600px 300px}
  .play .ring-dash{animation:fadeIn .8s ease .6s forwards, spin 80s linear infinite}
  .ring-core{fill:none;stroke-width:1.6;stroke-dasharray:742;stroke-dashoffset:742;transform-origin:600px 300px}
  .play .ring-core{animation:draw 1.3s var(--ease-out) .55s forwards, sway 9s ease-in-out 2s infinite}
  .ring-pulse{fill:none;stroke:url(#gCore);stroke-width:1.6;opacity:0;transform-origin:600px 300px}
  .ring-pulse.go{animation:ringPulse 1.1s var(--ease-out)}
  @keyframes ringPulse{0%{opacity:.9;transform:scale(1);stroke-width:2.4}100%{opacity:0;transform:scale(1.32);stroke-width:.5}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}

  .link{fill:none;stroke-width:1.3;stroke-linecap:round}
  .link-base{transition:opacity .35s ease}
  .comet{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:0;filter:url(#softGlow)}
  .live .comet{opacity:1;animation:comet var(--dur) linear var(--delay) infinite}
  @keyframes comet{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}

  /* ---------- Cards ---------- */
  .node{
    position:absolute;width:232px;height:76px;display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.04);
    opacity:0;transition:box-shadow .45s ease,border-color .45s ease,transform .45s var(--ease-out);
    cursor:default;
  }
  .node.l{transform:translateX(-28px)} .node.r{transform:translateX(28px)}
  .play .node{animation:nodeIn .8s var(--ease-out) forwards;animation-delay:var(--d)}
  @keyframes nodeIn{to{opacity:1;transform:translateX(0)}}
  .node .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;transition:transform .45s var(--ease-spring)}
  .node.l .ic{background:#ffe6e7} .node.r .ic{background:#f1f2ff}
  .node .ic svg{width:16px;height:16px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .node.l .ic svg{stroke:var(--red)} .node.r .ic svg{stroke:var(--blue)}
  .node .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;white-space:nowrap;overflow:hidden}
  .node .t1{font-size:13px;font-weight:500;color:var(--ink);line-height:normal}
  .node .t2{font-size:10px;font-weight:400;color:var(--muted);line-height:normal;display:inline-block}
  .node .t2.tick{animation:tick .5s var(--ease-out)}
  @keyframes tick{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
  .node .st{width:6px;height:6px;border-radius:50%;flex-shrink:0;position:relative}
  .node.l .st{background:var(--red);box-shadow:0 0 10px rgba(255,33,41,.8)}
  .node.r .st{background:var(--blue);box-shadow:0 0 10px rgba(46,71,255,.8)}
  .node .st::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;opacity:0}
  .node.hit .st::after{animation:ping 1s var(--ease-out)}
  @keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(4.5)}}
  .node.hit.l{border-color:rgba(255,33,41,.35);box-shadow:0 8px 26px rgba(255,33,41,.12)}
  .node.hit.r{border-color:rgba(46,71,255,.35);box-shadow:0 8px 26px rgba(46,71,255,.12)}
  .node.hit .ic{transform:scale(1.1)}
  .node:hover{box-shadow:0 10px 28px rgba(0,0,0,.08)}

  .side{position:absolute;top:10px;font-size:10px;font-weight:500;letter-spacing:1.2px;line-height:15px;opacity:0}
  .side.l{left:0;color:var(--red)} .side.r{right:0;color:var(--blue)}
  .play .side{animation:fadeUp .7s var(--ease-out) .35s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* port dots on links */
  .port{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;transform:scale(0)}
  .port.l{background:var(--red);box-shadow:0 0 8px rgba(255,33,41,.75)}
  .port.r{background:var(--blue);box-shadow:0 0 8px rgba(46,71,255,.75)}
  .play .port{animation:pop .5s var(--ease-spring) forwards;animation-delay:var(--d)}
  @keyframes pop{to{opacity:1;transform:scale(1)}}

  /* packets travelling on links */
  .packet{
    position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;padding:3px 9px;height:23px;
    background:#fff;border-radius:999px;font-size:10px;font-weight:500;color:var(--ink2);white-space:nowrap;line-height:15px;
    opacity:0;will-change:transform,opacity;
  }
  .packet.l{border:1px solid rgba(255,33,41,.5)} .packet.r{border:1px solid rgba(46,71,255,.5)}
  .packet i{width:5px;height:5px;border-radius:50%;display:block}
  .packet.l i{background:var(--red)} .packet.r i{background:var(--blue)}

  /* system chips around the core */
  .sys{
    position:absolute;display:flex;align-items:center;gap:6px;padding:5px 11px;height:29px;border-radius:999px;
    background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);
    font-size:11px;font-weight:500;color:var(--ink2);white-space:nowrap;line-height:17px;
    opacity:0;transform:scale(.6);
  }
  .play .sys{animation:sysIn .6s var(--ease-spring) forwards, bob 6s ease-in-out infinite;animation-delay:var(--d), calc(var(--d) + .6s)}
  @keyframes sysIn{to{opacity:1;transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--bob,-3px))}}
  .sys i{width:6px;height:6px;border-radius:50%;display:block;background:linear-gradient(135deg,var(--red),var(--blue));position:relative}
  .sys i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;opacity:0}
  .sys.hit i::after{animation:ping .9s var(--ease-out)}
  .sys.hit{border-color:#cfd2ff}

  /* core */
  .glow{position:absolute;border-radius:50%;opacity:0}
  .glow.white{left:500px;top:200px;width:200px;height:200px;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0))}
  .glow.blue{left:450px;top:225px;width:150px;height:150px;background:rgba(46,71,255,.18);filter:blur(20px)}
  .glow.red{left:600px;top:225px;width:150px;height:150px;background:rgba(255,33,41,.16);filter:blur(20px)}
  .play .glow{animation:fadeIn 1.2s ease .5s forwards}
  .play .glow.blue{animation:fadeIn 1.2s ease .5s forwards, breatheL 7s ease-in-out 1.7s infinite}
  .play .glow.red{animation:fadeIn 1.2s ease .5s forwards, breatheR 7s ease-in-out 1.7s infinite}
  @keyframes breatheL{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,-6px) scale(1.12)}}
  @keyframes breatheR{0%,100%{transform:translate(0,0) scale(1.08)}50%{transform:translate(-10px,6px) scale(.94)}}

  .orb-wrap{position:absolute;left:517.45px;top:215px;width:165.1px;height:170px;opacity:0;transform:scale(.4)}
  .play .orb-wrap{animation:orbIn 1.2s var(--ease-spring) .7s forwards}
  @keyframes orbIn{to{opacity:1;transform:scale(1)}}

    'M14.6667 8H10.6667L9.33333 10H6.66667L5.33333 8H1.33333M1.33333 8V12.6667H14.6667V8L12.3333 3.33333H3.66667L1.33333 8Z',

    'M9.8 4.2C9.29654 3.93604 8.72191 3.83987 8.15994 3.92552C7.59798 4.01117 7.07809 4.27417 6.67613 4.67613C6.27417 5.07809 6.01117 5.59798 5.92552 6.15994C5.83987 6.72191 5.93604 7.29654 6.2 7.8L2 12L4 14L8.2 9.8C8.70346 10.064 9.27809 10.1601 9.84006 10.0745C10.402 9.98883 10.9219 9.72583 11.3239 9.32387C11.7258 8.92191 11.9888 8.40202 12.0745 7.84006C12.1601 7.27809 12.064 6.70346 11.8 6.2L10.1333 7.86667L8.53333 7.46667L8.13333 5.86667L9.8 4.2Z'
  ];
  const NODES = [
    {side:'l', title:'Product drafts',   sub:'24 in review'},
    {side:'l', title:'Contracts',        sub:'6 awaiting signature'},
    {side:'l', title:'Delivery notes',   sub:'DN-55821 · synced'},
    {side:'l', title:'Dock bookings',    sub:'Today · 18 slots'},
    {side:'l', title:'Sales insights',   sub:'Sep · +4.2 pt vs category'},
    {side:'r', title:'Listing approvals',sub:'12 approved today'},
    {side:'r', title:'Planograms',       sub:'Breakfast · v3'},
    {side:'r', title:'Receiving',        sub:'Gebze DC · live'},
    {side:'r', title:'Scorecards',       sub:'Doğa Tarım · 9.4'},
    {side:'r', title:'Work orders',      sub:'2 SLA alerts'},
  ];
  const ROW_Y = [78, 190, 302, 414, 526];        // link y at card edge
  const CORE_Y = [272, 286, 300, 314, 328];      // link y at core ring
  const PORT_Y = [89.64, 195.76, 301.88, 408, 514.12];

  const nodesEl = document.getElementById('nodes');
  const nodeEls = NODES.map((n, i) => {
    const row = i % 5, el = document.createElement('div');
    el.className = `node ${n.side}`;
    el.style.left = (n.side === 'l' ? 0 : 968) + 'px';
    el.style.top = (40 + row * 112) + 'px';
    el.style.setProperty('--d', (0.7 + row * 0.08 + (n.side === 'r' ? 0.04 : 0)) + 's');
    el.dataset.idx = i;
    el.innerHTML = `<div class="ic"><svg viewBox="0 0 16 16"><path d="${ICONS[i]}"/></svg></div>
      <div class="tx"><span class="t1">${n.title}</span><span class="t2">${n.sub}</span></div><span class="st"></span>`;
    nodesEl.appendChild(el);
    return el;
  });

  /* ---------- links + comets ---------- */
  const gLinks = document.getElementById('links'), gCom = document.getElementById('comets');
  const linkPaths = [], cometPaths = [];
  for (let i = 0; i < 10; i++) {
    const row = i % 5, a = ROW_Y[row], b = CORE_Y[row];
    const d = i < 5 ? `M232 ${a}C402 ${a} 332 ${b} 482 ${b}` : `M718 ${b}C868 ${b} 798 ${a} 968 ${a}`;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'link link-base');
    p.setAttribute('stroke', i < 5 ? 'url(#gL)' : 'url(#gR)');
    gLinks.appendChild(p);
    linkPaths.push(p);

    const c = document.createElementNS(NS, 'path');
    c.setAttribute('d', d);
    c.setAttribute('class', 'comet');
    c.setAttribute('stroke', i < 5 ? 'url(#gCometL)' : 'url(#gCometR)');
    gCom.appendChild(c);
    cometPaths.push(c);
  }
  linkPaths.forEach((p, i) => {
    const L = p.getTotalLength(); p._len = L;
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = L;
    const c = cometPaths[i], seg = 26;
    c.style.strokeDasharray = `${seg} ${L + 60}`;
    // left: travel node → core ; right: core → node (both are path-forward)
    c.style.setProperty('--from', seg);
    c.style.setProperty('--to', -(L + 30));
    c.style.setProperty('--dur', (2.6 + (i * 0.37) % 1.4).toFixed(2) + 's');
    c.style.setProperty('--delay', ((i * 0.53) % 2.2).toFixed(2) + 's');
  });

  /* ---------- ports ---------- */
  const portsEl = document.getElementById('ports');
  for (let i = 0; i < 10; i++) {
    const row = i % 5, el = document.createElement('div');
    el.className = 'port ' + (i < 5 ? 'l' : 'r');
    el.style.left = (i < 5 ? 283.5 : 909.5) + 'px';
    el.style.top = (PORT_Y[row] - 3.5) + 'px';
    el.style.setProperty('--d', (1.75 + row * 0.06) + 's');
    portsEl.appendChild(el);
  }

  /* ---------- packets ---------- */
  const PACKETS = [
    {id:'SKU-8812',    link:0, node:0, msg:'SKU-8812 listed · Breakfast'},
    {id:'CTR-2026/Q4', link:1, node:1, msg:'CTR-2026/Q4 signed · Doğa Tarım'},
    {id:'REZ-1042',    link:3, node:3, msg:'REZ-1042 approved · Gebze DC'},
    {id:'LST-0042',    link:5, node:5, msg:'LST-0042 approved · Listing', count:true},
    {id:'ASN-7731',    link:7, node:7, msg:'ASN-7731 received · Gebze DC'},
    {id:'WO-2046',     link:8, node:9, msg:'WO-2046 SLA alert · Store 140'},
  ];
  const packetsEl = document.getElementById('packets');
  PACKETS.forEach((pk, k) => {
    const el = document.createElement('div');
    el.className = 'packet ' + (pk.link < 5 ? 'l' : 'r');
    el.innerHTML = `<i></i>${pk.id}`;
    packetsEl.appendChild(el);
    pk.el = el;
    pk.dur = 4200 + (k % 3) * 500;
    pk.next = 0;          // set at start
    pk.t0 = null;
  });

  /* ---------- live stream ---------- */
  const eventsEl = document.getElementById('events');
  let clock = 9 * 3600 + 30 * 60 + 12;
  const fmt = s => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');
  function seedEvents(){
    eventsEl.innerHTML = '';
    [['09:29:51','WO-2046 SLA alert · Store 140'],['09:30:08','SKU-8812 listed · Breakfast'],['09:30:12','REZ-1042 approved · Gebze DC']]
      .forEach(([t, m]) => addEvent(m, t, false));
  }
  function addEvent(msg, time, animate = true){
    const row = eventsEl;
    row.getAnimations().forEach(a => a.finish());
    let added = 0;
    if (row.children.length) {
      const sep = document.createElement('span'); sep.className = 'sep';
      row.prepend(sep); added += 1 + 18;
    }
    const ev = document.createElement('div');
    ev.className = 'ev' + (animate ? ' new' : '');
    ev.innerHTML = `<span class="tm">${time}</span><span class="msg">${msg}</span>`;
    row.prepend(ev);
    if (animate) {
      added += ev.offsetWidth + 18;
      // slide the existing row right while the new event rises in at the front
      row.animate([{transform:`translateX(${-added}px)`},{transform:'translateX(0)'}],
        {duration:650, easing:'cubic-bezier(.22,1,.36,1)'});
      ev.animate([{opacity:0, transform:`translateX(${added}px) translateY(10px)`},{opacity:1, transform:'translateX(0) translateY(0)'}],
        {duration:650, easing:'cubic-bezier(.22,1,.36,1)'});
    }
    while (row.children.length > 9) row.lastElementChild.remove();
  }

  /* ---------- reactions ---------- */
  const sysEls = [...document.querySelectorAll('[data-sys]')];
  let sysIdx = 0;
  const ringPulse = document.getElementById('ringPulse');
  const orb = document.getElementById('orb');
  const star = document.getElementById('star');
  function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function coreHit(){
    retrigger(ringPulse, 'go');
    retrigger(orb, 'beat');
    star.animate([{transform:'scale(1)'},{transform:'scale(.72)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:700,easing:'ease-out'});
    const s = sysEls[sysIdx++ % sysEls.length];
    retrigger(s, 'hit'); setTimeout(() => s.classList.remove('hit'), 1200);
  }
  function nodeHit(i, pk){
    const el = nodeEls[i];
    retrigger(el, 'hit');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('hit'), 1300);
    if (pk && pk.count) {
      const t2 = el.querySelector('.t2');
      const n = parseInt(t2.textContent, 10) + 1;
      t2.textContent = `${n} approved today`;
      retrigger(t2, 'tick');
    }
  }

  /* ---------- packet engine ---------- */
  let raf = null, running = false, startTime = 0;
  const T0 = 0.11, T1 = 0.89;               // keep pills off cards/core
  function place(pk, u){
    const p = linkPaths[pk.link], L = p._len;
    const t = T0 + (T1 - T0) * u;
    const pt = p.getPointAtLength(L * t);
    const w = pk.el.offsetWidth, h = 23;
    const fade = Math.min(1, u / 0.12, (1 - u) / 0.12);
    pk.el.style.transform = `translate(${pt.x - w / 2}px, ${pt.y - h / 2}px) scale(${0.85 + 0.15 * fade})`;
    pk.el.style.opacity = fade;
  }
  function frame(now){
    if (!running) return;
    PACKETS.forEach(pk => {
      if (pk.t0 === null) {
        if (now >= pk.next) {
          pk.t0 = now;
          if (pk.link < 5) nodeHit(pk.node);         // supplier node emits
          else coreHit();                             // core dispatches
        } else return;
      }
      const u = (now - pk.t0) / pk.dur;
      if (u >= 1) {
        pk.el.style.opacity = 0;
        pk.t0 = null;
        pk.next = now + 900 + Math.random() * 2600;
        if (pk.link < 5) coreHit(); else nodeHit(pk.node, pk);
        clock += 1 + Math.floor(Math.random() * 4);
        addEvent(pk.msg, fmt(clock));
        return;
      }
      // ease in-out along path
      const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      place(pk, 0.15 * u + 0.85 * e);
    });
    raf = requestAnimationFrame(frame);
  }

  /* ---------- link draw-in (JS so we know lengths) ---------- */
  function drawLinks(){
    linkPaths.forEach((p, i) => {
      const row = i % 5;
      p.animate([{strokeDashoffset:p._len},{strokeDashoffset:0}],
        {duration:1000, delay:1250 + row * 70 + (i >= 5 ? 120 : 0), easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards'});
    });
  }

  /* ---------- hover focus ---------- */
  nodeEls.forEach((el, i) => {
    el.addEventListener('mouseenter', () => {
      stage.classList.add('focusing');
      linkPaths[i].classList.add('on'); cometPaths[i].classList.add('on');
    });
    el.addEventListener('mouseleave', () => {
      stage.classList.remove('focusing');
      linkPaths[i].classList.remove('on'); cometPaths[i].classList.remove('on');
    });
  });

  /* ---------- static layout for reduced motion ---------- */
  function staticLayout(){
    linkPaths.forEach(p => { p.style.strokeDashoffset = 0; });
    PACKETS.forEach(pk => { place(pk, 0.5); pk.el.style.opacity = 1; pk.el.style.transform = pk.el.style.transform.replace(/scale\([^)]*\)/, ''); });
  }

  /* ---------- play / replay ---------- */
  function play(){
    running = false; cancelAnimationFrame(raf);
    stage.classList.remove('play', 'live');
    linkPaths.forEach(p => { p.getAnimations().forEach(a => a.cancel()); p.style.strokeDashoffset = p._len; });
    PACKETS.forEach(pk => { pk.el.style.opacity = 0; pk.t0 = null; });
    nodeEls[5].querySelector('.t2').textContent = '12 approved today';
    clock = 9 * 3600 + 30 * 60 + 12;
    seedEvents();
    void stage.offsetWidth;

    if (reduce) { stage.classList.add('play'); staticLayout(); return; }

    stage.classList.add('play');
    drawLinks();
    setTimeout(() => {
      stage.classList.add('live');
      running = true;
      const now = performance.now();
      PACKETS.forEach((pk, k) => { pk.next = now + 200 + k * 650; });
      raf = requestAnimationFrame(frame);
    }, 2500);
  }
  document.getElementById('replay').addEventListener('click', play);
  // inside a Snapshots grid frame (?tile) the frame's own play badge sits here, so hide Replay
  if (new URLSearchParams(location.search).has('tile')) document.getElementById('replay').hidden = true;
  // in the Snapshots viewer, keep Esc and the arrow keys working after a click inside the animation
  addEventListener('keydown', e => { if (parent !== window && ['Escape', 'ArrowLeft', 'ArrowRight'].includes(e.key)) try { parent.document.dispatchEvent(new KeyboardEvent('keydown', {key: e.key})); } catch (_) {} });

  // pause when tab hidden to avoid a burst of events on return
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; cancelAnimationFrame(raf); }
    else if (stage.classList.contains('live') && !reduce) {
      const now = performance.now();
      PACKETS.forEach((pk, k) => { pk.t0 = null; pk.el.style.opacity = 0; pk.next = now + 300 + k * 500; });
      running = true; raf = requestAnimationFrame(frame);
    }
  });

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
})();
